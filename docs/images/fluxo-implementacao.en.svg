<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc">
<title id="title">Implement</title><desc id="desc">Implementation: code, test, validate and archive OpenSpec, then open the PR. Failed test? Fix and rerun before moving on.</desc>
