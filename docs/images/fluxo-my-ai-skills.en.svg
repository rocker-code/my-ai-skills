<path d="M854 673 L860 683 L866 673" fill="#a78bfa" />
<text x="70" y="704" font-size="19" fill="#8b98a6" font-weight="bold">ISSUE-DRIVEN EXECUTION · PLAN → IMPLEMENT → REVIEW</text>
<rect x="70" y="735" width="500" height="657" rx="18" fill="#121921" stroke="#303842" stroke-width="2" />
<rect x="94" y="758" width="43" height="43" rx="10" fill="#58a6ff" stroke="#58a6ff" stroke-width="2" />
