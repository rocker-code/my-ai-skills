<text x="1193" y="1063" font-size="25" fill="#e6edf3" font-weight="bold">Fix and reassess</text>
<text x="1193" y="1098" font-size="18" fill="#b2bdc9" font-weight="normal">Findings require renewed verification.</text>
<text x="1193" y="1130" font-size="17" fill="#3fb950" font-weight="normal">github-resolution · post-pr-audit</text>
<path d="M1400 1153 L1400 1176" stroke="#3fb950" stroke-width="3" fill="none" />
