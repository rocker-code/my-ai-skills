<rect x="1174" y="1180" width="5" height="123" fill="#3fb950" />
<text x="1193" y="1216" font-size="25" fill="#e6edf3" font-weight="bold">Merge when approved</text>
<text x="1193" y="1251" font-size="18" fill="#b2bdc9" font-weight="normal">CI, audits and protections satisfied.</text>
<text x="1193" y="1283" font-size="17" fill="#3fb950" font-weight="normal">Merge when green</text>
<text x="1174" y="1361" font-size="17" fill="#9ca9b6" font-weight="normal">Release and deployment are separate.</text>
<text x="450" y="1433" font-size="21" fill="#e3b341" font-weight="normal">On failure: fix and rerun affected checks before merging.</text>
<rect x="70" y="1460" width="1580" height="82" rx="18" fill="#13232b" stroke="#28525e" stroke-width="2" />
<text x="96" y="1491" font-size="17" fill="#65d4e4" font-weight="bold">CONTINUITY BETWEEN SESSIONS</text>
<text x="96" y="1523" font-size="23" fill="#e6edf3" font-weight="normal">ai-memory · Context, notes and work resumption across agents.</text>
<rect x="70" y="1560" width="1580" height="82" rx="18" fill="#151c24" stroke="#303842" stroke-width="2" />
<text x="96" y="1591" font-size="17" fill="#9ca9b6" font-weight="bold">RECORDS AND CONTINUOUS IMPROVEMENT</text>
<text x="96" y="1623" font-size="23" fill="#e6edf3" font-weight="normal">GitHub keeps decisions and evidence · Kaizen turns failures into improvements.</text>
<text x="70" y="1673" font-size="16" fill="#83909f" font-weight="normal">Simplified workflow · rocker-code/my-ai-skills · *contract-handoff for cross-project integrations</text>
