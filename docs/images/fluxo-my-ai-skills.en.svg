<text x="155" y="791" font-size="29" fill="#e6edf3" font-weight="bold">Plan</text>
<text x="94" y="840" font-size="21" fill="#9ca9b6" font-weight="normal">Understand before changing</text>
<rect x="94" y="874" width="452" height="123" rx="13" fill="#1c2633" stroke="#1c2633" stroke-width="2" />
<rect x="94" y="874" width="5" height="123" fill="#58a6ff" />
