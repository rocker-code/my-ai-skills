<text x="653" y="1063" font-size="25" fill="#e6edf3" font-weight="bold">Test and verify</text>
<text x="653" y="1098" font-size="18" fill="#b2bdc9" font-weight="normal">Focused scenarios and required checks.</text>
<text x="653" y="1130" font-size="17" fill="#b68cff" font-weight="normal">Local tests and checks</text>
<path d="M860 1153 L860 1176" stroke="#b68cff" stroke-width="3" fill="none" />
<path d="M854 1166 L860 1176 L866 1166" fill="#b68cff" />
<rect x="634" y="1180" width="452" height="123" rx="13" fill="#1c2633" stroke="#1c2633" stroke-width="2" />
<rect x="634" y="1180" width="5" height="123" fill="#b68cff" />
<text x="653" y="1216" font-size="25" fill="#e6edf3" font-weight="bold">Open the Pull Request</text>
<text x="653" y="1251" font-size="18" fill="#b2bdc9" font-weight="normal">Verify and archive the change.</text>
<text x="653" y="1283" font-size="17" fill="#b68cff" font-weight="normal">prepare-pr · OpenSpec</text>
<text x="634" y="1361" font-size="17" fill="#9ca9b6" font-weight="normal">Evidence and checks accompany the PR.</text>
<rect x="1150" y="735" width="500" height="657" rx="18" fill="#121921" stroke="#303842" stroke-width="2" />
<rect x="1174" y="758" width="43" height="43" rx="10" fill="#3fb950" stroke="#3fb950" stroke-width="2" />
<text x="1186" y="789" font-size="26" fill="#0c1117" font-weight="bold">4</text>
<text x="1235" y="791" font-size="29" fill="#e6edf3" font-weight="bold">Review and merge</text>
<text x="1174" y="840" font-size="21" fill="#9ca9b6" font-weight="normal">Audit before merging</text>
<rect x="1174" y="874" width="452" height="123" rx="13" fill="#1c2633" stroke="#1c2633" stroke-width="2" />
<rect x="1174" y="874" width="5" height="123" fill="#3fb950" />
<text x="1193" y="910" font-size="25" fill="#e6edf3" font-weight="bold">Audit in another session</text>
<text x="1193" y="945" font-size="18" fill="#b2bdc9" font-weight="normal">Requirements, code and architecture.</text>
<text x="1193" y="977" font-size="17" fill="#3fb950" font-weight="normal">pr-audit · architecture-audit</text>
