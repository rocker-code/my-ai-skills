<text x="646" y="789" font-size="26" fill="#0c1117" font-weight="bold">3</text>
<text x="695" y="791" font-size="29" fill="#e6edf3" font-weight="bold">Implement</text>
<text x="634" y="840" font-size="21" fill="#9ca9b6" font-weight="normal">Execute the validated proposal</text>
<rect x="634" y="874" width="452" height="123" rx="13" fill="#1c2633" stroke="#1c2633" stroke-width="2" />
<rect x="634" y="874" width="5" height="123" fill="#b68cff" />
<text x="653" y="910" font-size="25" fill="#e6edf3" font-weight="bold">Implement</text>
<text x="653" y="945" font-size="18" fill="#b2bdc9" font-weight="normal">Fresh session with the pinned proposal.</text>
<text x="653" y="977" font-size="17" fill="#b68cff" font-weight="normal">apply-issue · OpenSpec</text>
