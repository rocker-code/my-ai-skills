<text x="96" y="576" font-size="18" fill="#baa3ff" font-weight="bold">ORCHESTRATION · CLI AGENT</text>
<text x="96" y="615" font-size="28" fill="#e6edf3" font-weight="bold">“Take care of this issue: URL” or a milestone</text>
<text x="1138" y="579" font-size="18" fill="#baa3ff" font-weight="normal">milestone-orchestrator</text>
<text x="1138" y="614" font-size="21" fill="#b7bdca" font-weight="normal">Orders work and dependencies.</text>
