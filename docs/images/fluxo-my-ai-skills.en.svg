<text x="113" y="1063" font-size="25" fill="#e6edf3" font-weight="bold">Explore and specify</text>
<text x="113" y="1098" font-size="18" fill="#b2bdc9" font-weight="normal">OpenSpec proposal reviewed and validated.</text>
<text x="113" y="1130" font-size="17" fill="#58a6ff" font-weight="normal">implement-issue · OpenSpec</text>
