<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1690" viewBox="0 0 1720 1690" role="img" aria-labelledby="title desc">
<title id="title">How my-ai-skills works: from idea to merge</title>
<desc id="desc">The Web agent creates and refines GitHub issues. The CLI agent coordinates OpenSpec planning, implementation, tests and review through merge.</desc>
<rect width="1720" height="1690" fill="#0c1117" />
<g font-family="DejaVu Sans, sans-serif">
<text x="70" y="60" font-size="19" fill="#8b98a6" font-weight="bold">FROM IDEA TO MERGE</text>
<text x="70" y="120" font-size="46" fill="#e6edf3" font-weight="bold">How my-ai-skills works</text>
<text x="70" y="166" font-size="26" fill="#a4afbc" font-weight="normal">The Web agent defines the work. The CLI agent delivers with OpenSpec.</text>
<rect x="70" y="210" width="1580" height="282" rx="18" fill="#10252c" stroke="#43b9cd" stroke-width="2" />
<text x="96" y="250" font-size="22" fill="#65d4e4" font-weight="bold">1   CREATE AND REFINE ISSUES · WEB AGENT</text>
<text x="96" y="293" font-size="29" fill="#e6edf3" font-weight="bold">ChatGPT · Claude · other agents with project instructions</text>
<text x="96" y="345" font-size="23" fill="#e6edf3" font-weight="bold">You describe the need</text>
<text x="96" y="383" font-size="19" fill="#afc2cc" font-weight="normal">Feature, problem or design.</text>
<text x="96" y="413" font-size="19" fill="#afc2cc" font-weight="normal">Project instructions point to the skills.</text>
<text x="650" y="345" font-size="23" fill="#e6edf3" font-weight="bold">The agent applies Web skills</text>
<text x="650" y="383" font-size="19" fill="#afc2cc" font-weight="normal">Inspects code, decisions and contracts.</text>
<text x="650" y="413" font-size="19" fill="#afc2cc" font-weight="normal">Defines acceptance, tests, design and i18n.</text>
<text x="1200" y="345" font-size="23" fill="#e6edf3" font-weight="bold">The issue lives in GitHub</text>
<text x="1200" y="383" font-size="19" fill="#afc2cc" font-weight="normal">Clear scope and dependencies.</text>
<text x="1200" y="413" font-size="19" fill="#afc2cc" font-weight="normal">Accessible decisions and references.</text>
