<text x="113" y="1216" font-size="25" fill="#e6edf3" font-weight="bold">Prepare execution</text>
<text x="113" y="1251" font-size="18" fill="#b2bdc9" font-weight="normal">Readiness and cross-project contract.</text>
<text x="113" y="1283" font-size="17" fill="#58a6ff" font-weight="normal">issue-ready · contract-handoff*</text>
<text x="94" y="1361" font-size="17" fill="#9ca9b6" font-weight="normal">Material decisions return to the owner.</text>
