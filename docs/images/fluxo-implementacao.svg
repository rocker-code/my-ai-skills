<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, sans-serif">
<title id="title">Implementar</title><desc id="desc">Implementação: codar, testar, validar e arquivar o OpenSpec, depois abrir a PR. Teste falhou? Corrigir e testar de novo antes de avançar.</desc>
<rect width="960" height="310" rx="20" fill="#0c1117" />
<g font-family="DejaVu Sans, sans-serif">
<text x="28" y="45" font-size="27" font-weight="700" fill="#e6edf3">Implementar</text>
<text x="28" y="74" font-size="17" fill="#a4afbc">Do plano validado a uma PR pronta para revisão.</text>
<rect x="28" y="103" width="210" height="136" rx="14" fill="#1c2633" stroke="#303842" stroke-opacity="1" stroke-width="1.5" />
<rect x="28" y="103" width="4" height="136" fill="#b68cff" /><rect x="42" y="118" width="28" height="28" rx="7" fill="#b68cff" /><text x="56" y="137" text-anchor="middle" fill="#0c1117" font-size="14" font-weight="700">1</text>
<text x="45" y="177" font-size="23" font-weight="700" fill="#e6edf3">Codar</text>
<text x="45" y="207" font-size="15" fill="#a4afbc">Seguir o plano</text>
<path d="M 244 170 h 9 m -4 -5 l 5 5 -5 5" fill="none" stroke="#b68cff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<rect x="259" y="103" width="210" height="136" rx="14" fill="#1c2633" stroke="#303842" stroke-opacity="1" stroke-width="1.5" />
<rect x="259" y="103" width="4" height="136" fill="#b68cff" /><rect x="273" y="118" width="28" height="28" rx="7" fill="#b68cff" /><text x="287" y="137" text-anchor="middle" fill="#0c1117" font-size="14" font-weight="700">2</text>
<text x="276" y="177" font-size="23" font-weight="700" fill="#e6edf3">Testar</text>
<text x="276" y="207" font-size="15" fill="#a4afbc">Provar que funciona</text>
<path d="M 475 170 h 9 m -4 -5 l 5 5 -5 5" fill="none" stroke="#b68cff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<rect x="490" y="103" width="210" height="136" rx="14" fill="#1c2633" stroke="#303842" stroke-opacity="1" stroke-width="1.5" />
<rect x="490" y="103" width="4" height="136" fill="#b68cff" /><rect x="504" y="118" width="28" height="28" rx="7" fill="#b68cff" /><text x="518" y="137" text-anchor="middle" fill="#0c1117" font-size="14" font-weight="700">3</text>
<text x="507" y="177" font-size="23" font-weight="700" fill="#e6edf3">Arquivar</text>
<text x="507" y="207" font-size="15" fill="#a4afbc">Validar o OpenSpec</text>
<path d="M 706 170 h 9 m -4 -5 l 5 5 -5 5" fill="none" stroke="#b68cff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<rect x="721" y="103" width="210" height="136" rx="14" fill="#1c2633" stroke="#303842" stroke-opacity="1" stroke-width="1.5" />
<rect x="721" y="103" width="4" height="136" fill="#b68cff" /><rect x="735" y="118" width="28" height="28" rx="7" fill="#b68cff" /><text x="749" y="137" text-anchor="middle" fill="#0c1117" font-size="14" font-weight="700">4</text>
<text x="738" y="177" font-size="23" font-weight="700" fill="#e6edf3">Abrir PR</text>
<text x="738" y="207" font-size="15" fill="#a4afbc">Enviar para revisão</text>

<text x="28" y="279" font-size="15" fill="#a4afbc">Teste falhou? Corrigir e testar de novo antes de avançar.</text>
</g></svg>