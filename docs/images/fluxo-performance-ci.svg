<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc">
<title id="title">Acelerar o CI</title><desc id="desc">Performance: detectar lentidão, medir o gargalo, otimizar e comparar tempo e cobertura. Só adotar a melhoria se preservar as verificações necessárias.</desc>
<rect width="960" height="310" rx="20" fill="#ffffff"/>
<g font-family="DejaVu Sans,Arial,sans-serif">
<text x="28" y="45" font-size="27" font-weight="700" fill="#0f172a">Acelerar o CI</text>
<text x="28" y="74" font-size="17" fill="#475569">Quando há lentidão, melhorar com evidência.</text>
<rect x="28" y="103" width="210" height="136" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-opacity=".2"/>
<circle cx="56" cy="132" r="14" fill="#4f46e5"/><text x="56" y="137" text-anchor="middle" fill="white" font-size="14" font-weight="700">1</text>
<text x="45" y="177" font-size="23" font-weight="700" fill="#0f172a">Detectar</text>
<text x="45" y="207" font-size="15" fill="#475569">Encontrar a lentidão</text>
<path d="M 244 170 h 9 m -4 -5 l 5 5 -5 5" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="259" y="103" width="210" height="136" rx="14" fill="#ecfeff" stroke="#0e7490" stroke-opacity=".2"/>
<circle cx="287" cy="132" r="14" fill="#0e7490"/><text x="287" y="137" text-anchor="middle" fill="white" font-size="14" font-weight="700">2</text>
<text x="276" y="177" font-size="23" font-weight="700" fill="#0f172a">Medir</text>
<text x="276" y="207" font-size="15" fill="#475569">Localizar o gargalo</text>
<path d="M 475 170 h 9 m -4 -5 l 5 5 -5 5" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="490" y="103" width="210" height="136" rx="14" fill="#fffbeb" stroke="#b45309" stroke-opacity=".2"/>
<circle cx="518" cy="132" r="14" fill="#b45309"/><text x="518" y="137" text-anchor="middle" fill="white" font-size="14" font-weight="700">3</text>
<text x="507" y="177" font-size="23" font-weight="700" fill="#0f172a">Otimizar</text>
<text x="507" y="207" font-size="15" fill="#475569">Testar uma mudança</text>
<path d="M 706 170 h 9 m -4 -5 l 5 5 -5 5" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="721" y="103" width="210" height="136" rx="14" fill="#ecfdf5" stroke="#047857" stroke-opacity=".2"/>
<circle cx="749" cy="132" r="14" fill="#047857"/><text x="749" y="137" text-anchor="middle" fill="white" font-size="14" font-weight="700">4</text>
<text x="738" y="177" font-size="23" font-weight="700" fill="#0f172a">Comparar</text>
<text x="738" y="207" font-size="15" fill="#475569">Tempo + cobertura</text>

<text x="28" y="279" font-size="15" fill="#475569">Só adotar a melhoria se preservar as verificações necessárias.</text>
</g></svg>
